<rect class="bg" width="2400" height="1500"/>

<!-- HEADER -->
<text class="t title" x="70" y="68">QIWEN《漆问》｜Human–Agent Cultural Game Co-Creation System</text>
<text class="tm body" x="72" y="99">从非遗知识采集、知识转译到 Agent 共创、生成式资产与 Unity 游戏构建的完整系统框架</text>
<line x1="70" y1="122" x2="2330" y2="122" class="thick"/>

<!-- TOP CORE -->
<rect class="blk" x="70" y="150" width="2260" height="82" rx="10"/>
<text class="tw micro" x="96" y="179">CORE SYSTEM LOGIC</text>
<text class="tw h1" x="96" y="211">Knowledge → Interpretation → Co-creation → Asset Generation → Unity Construction → Playtest → Reflection</text>
<text class="tw body" x="1840" y="203">AI proposes · Human decides</text>

<!-- Section labels -->
<text class="t h1" x="70" y="286">01  KNOWLEDGE FOUNDATION</text>
<text class="tm small" x="382" y="286">知识不是实时生成，而是预先采集、整理、核验并结构化</text>

