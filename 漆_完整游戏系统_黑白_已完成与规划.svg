<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
<defs>
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#111}
.h1{font-size:38px;font-weight:700}.h2{font-size:25px;font-weight:700}.h3{font-size:19px;font-weight:700}
.b{font-size:16px}.s{font-size:14px;fill:#333}.xs{font-size:12px;fill:#555}
.box{fill:#fff;stroke:#111;stroke-width:1.5}.gray{fill:#f3f3f3;stroke:#111;stroke-width:1.4}.black{fill:#111}.white{fill:#fff}
.line{stroke:#111;stroke-width:1.6;fill:none}.dash{stroke:#111;stroke-width:1.3;stroke-dasharray:7 6;fill:none}.thick{stroke:#111;stroke-width:3;fill:none}
.status{font-size:11px;font-weight:700;letter-spacing:1px}
</style>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8.8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#111"/></marker>
</defs>
<rect width="1900" height="1280" fill="#fff"/>

<!-- title -->
<text class="t h1" x="60" y="62">02 设计方案</text>
<text class="t h2" x="60" y="100">《漆》LACQUER HOUSE · 完整游戏系统 / 已完成 + 规划中</text>
<line x1="60" y1="128" x2="1840" y2="128" class="thick"/>

<!-- concept -->
<rect x="60" y="155" width="610" height="170" rx="14" class="gray"/>
<text class="t h2" x="86" y="193">项目概念 / CONCEPT</text>
<text class="t b" x="86" y="230">玩家进入祖辈漆艺大宅，以大漆制作工序为主线，</text>
<text class="t b" x="86" y="258">通过书籍线索解谜、工艺操作、材料采集与环境调节，</text>
<text class="t b" x="86" y="286">逐步还原完整漆艺流程，并在不同玩法中理解传统工艺。</text>

<!-- world -->
<rect x="700" y="155" width="1140" height="170" rx="14" class="box"/>
<text class="t h2" x="728" y="193">世界观 / WORLD</text>
<circle cx="770" cy="260" r="34" class="box"/>
<text class="t s" x="748" y="315">玩家</text>
<line x1="805" y1="260" x2="900" y2="260" class="line" marker-end="url(#arr)"/>
<rect x="910" y="220" width="205" height="80" rx="8" class="gray"/>
<text class="t h3" x="953" y="251">进入漆艺祖宅</text>
<text class="t s" x="948" y="278">寻找工艺与家族线索</text>
<line x1="1115" y1="260" x2="1205" y2="260" class="line" marker-end="url(#arr)"/>
<rect x="1215" y="220" width="235" height="80" rx="8" class="box"/>
<text class="t h3" x="1252" y="251">完成不同工序挑战</text>
<text class="t s" x="1254" y="278">解谜 / 制作 / 采集 / 环境</text>
<line x1="1450" y1="260" x2="1540" y2="260" class="line" marker-end="url(#arr)"/>
<rect x="1550" y="220" width="235" height="80" rx="8" class="black"/>
<text class="t white h3" x="1592" y="251">还原完整制漆流程</text>
<text class="t white s" x="1598" y="278">推进故事与最终结局</text>

<!-- game system header -->
<rect x="60" y="365" width="1780" height="48" rx="7" class="black"/>
<text class="t white h2" x="655" y="398">GAMEPLAY SYSTEM · 六类游戏与交互模块</text>

<!-- branch diagram -->
<circle cx="950" cy="475" r="54" class="black"/>
<text class="t white h3" x="905" y="470">漆艺工序</text>
<text class="t white s" x="912" y="494">GAME CORE</text>

<!-- top branch lines -->
<path d="M900 500 C760 535 600 540 470 565" class="line" marker-end="url(#arr)"/>
<path d="M920 520 C820 575 760 610 705 655" class="line" marker-end="url(#arr)"/>
<path d="M980 520 C1080 575 1140 610 1195 655" class="line" marker-end="url(#arr)"/>
<path d="M1000 500 C1140 535 1300 540 1430 565" class="line" marker-end="url(#arr)"/>

<!-- completed 1 -->
<rect x="105" y="560" width="340" height="220" rx="14" class="box"/>
<rect x="125" y="580" width="94" height="26" rx="4" class="black"/>
<text class="t white status" x="143" y="598">已完成</text>
<text class="t h2" x="125" y="640">① 书籍顺序解谜</text>
<text class="t s" x="125" y="676">房间内有大量书籍与提示</text>
<text class="t s" x="125" y="702">找到正确书籍 → 判断先后关系</text>
<text class="t s" x="125" y="728">排列出正确的工艺步骤顺序</text>
<rect x="125" y="748" width="290" height="1" class="black"/>
<text class="t xs" x="125" y="768">作用：解锁对应的工艺体验环节</text>

<!-- completed 2 -->
<rect x="520" y="650" width="360" height="230" rx="14" class="gray"/>
<rect x="540" y="670" width="94" height="26" rx="4" class="black"/>
<text class="t white status" x="558" y="688">已完成</text>
<text class="t h2" x="540" y="730">② 工艺解压小游戏</text>
<text class="t s" x="540" y="766">每个工艺步骤对应独立操作</text>
<text class="t s" x="540" y="792">按要求点击 / 连续操作 / 节奏反馈</text>
<text class="t s" x="540" y="818">同步触发具有“解压感”的工艺声音</text>
<rect x="540" y="840" width="300" height="1" class="black"/>
<text class="t xs" x="540" y="860">作用：把抽象工艺步骤变成身体化体验</text>

<!-- completed 3 -->
<rect x="1020" y="650" width="360" height="230" rx="14" class="gray"/>
<rect x="1040" y="670" width="94" height="26" rx="4" class="black"/>
<text class="t white status" x="1058" y="688">已完成</text>
<text class="t h2" x="1040" y="730">③ 场景射击 / 采集</text>
<text class="t s" x="1040" y="766">进入独立场景寻找材料目标</text>
<text class="t s" x="1040" y="792">通过射击式操作命中目标</text>
<text class="t s" x="1040" y="818">完成材料采集并推进下一阶段</text>
<rect x="1040" y="840" width="300" height="1" class="black"/>
<text class="t xs" x="1040" y="860">作用：把“材料获取”转化为动态玩法</text>

<!-- planned 4 -->
<rect x="1455" y="560" width="340" height="220" rx="14" class="box"/>
<rect x="1475" y="580" width="94" height="26" rx="4" class="box"/>
<text class="t status" x="1493" y="598">规划中</text>
<text class="t h2" x="1475" y="640">④ 采漆谜题</text>
<text class="t s" x="1475" y="676">调整采漆时间、角度与位置</text>
<text class="t s" x="1475" y="702">观察漆液反应判断是否正确</text>
<text class="t s" x="1475" y="728">学习采漆禁忌与树木保护</text>
<rect x="1475" y="748" width="290" height="1" class="black"/>
<text class="t xs" x="1475" y="768">文档规划：通过尝试推理正确做法</text>

<!-- lower planned modules -->
<path d="M950 530 C950 625 950 745 950 915" class="line" marker-end="url(#arr)"/>
<path d="M950 890 C820 910 675 930 560 965" class="line" marker-end="url(#arr)"/>
<path d="M950 890 C1080 910 1225 930 1340 965" class="line" marker-end="url(#arr)"/>

<rect x="350" y="950" width="430" height="220" rx="14" class="box"/>
<rect x="372" y="972" width="94" height="26" rx="4" class="box"/>
<text class="t status" x="390" y="990">规划中</text>
<text class="t h2" x="372" y="1030">⑤ 配方谜题</text>
<text class="t s" x="372" y="1066">根据残缺配方书推测材料比例</text>
<text class="t s" x="372" y="1092">调漆后进行试片验证，允许多次试错</text>
<text class="t s" x="372" y="1118">对应朱砂红、松烟黑等传统漆色配方</text>
<text class="t xs" x="372" y="1148">核心：比例推理 → 调配 → 结果反馈</text>

<rect x="1120" y="950" width="430" height="220" rx="14" class="box"/>
<rect x="1142" y="972" width="94" height="26" rx="4" class="box"/>
<text class="t status" x="1160" y="990">规划中</text>
<text class="t h2" x="1142" y="1030">⑥ 工艺 / 环境谜题</text>
<text class="t s" x="1142" y="1066">观察破损漆器横截面，逆向推理原工艺</text>
<text class="t s" x="1142" y="1092">调节湿度 / 温度 / 光照，完成阴干过程</text>
<text class="t s" x="1142" y="1118">理解漆器多层结构与大漆固化条件</text>
<text class="t xs" x="1142" y="1148">核心：观察 → 修复 / 调节 → 工艺验证</text>

<!-- footer flow -->
<rect x="60" y="1200" width="1780" height="52" rx="9" class="black"/>
<text class="t white h3" x="185" y="1233">探索空间 → 找到线索 → 排出工序 → 进入工艺互动 → 获取材料 → 完成配方 / 修复 / 阴干 → 推进下一工序 → 完整漆器</text>
</svg>