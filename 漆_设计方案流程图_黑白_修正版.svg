<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
<defs>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#111}
.h1{font-size:36px;font-weight:700}.h2{font-size:23px;font-weight:700}.h3{font-size:17px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:#444}
.box{fill:#fff;stroke:#111;stroke-width:1.5}.gray{fill:#f4f4f4;stroke:#111;stroke-width:1.4}.blk{fill:#111}
.whiteText{fill:#fff !important}.line{stroke:#111;stroke-width:1.5;fill:none}.dash{stroke:#111;stroke-width:1.2;stroke-dasharray:6 5;fill:none}
</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="8.5" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="#111"/></marker>
</defs>
<rect width="1800" height="1050" fill="#fff"/>
<text class="h1" x="55" y="62">DESIGN PROCESS</text>
<text class="h2" x="55" y="98">《漆》游戏设计流程 · 从漆艺知识到可交互游戏机制</text>
<line x1="55" y1="126" x2="1745" y2="126" stroke="#111" stroke-width="2.5"/>

<!-- main design process -->
<g>
<rect x="70" y="170" width="240" height="92" rx="12" class="gray"/>
<text class="h3" x="102" y="204">01 提取漆艺内容</text>
<text class="b" x="102" y="232">材料 · 工序 · 配方 · 环境</text>
<text class="s" x="102" y="252">建立游戏知识基础</text>

<line x1="310" y1="216" x2="365" y2="216" class="line" marker-end="url(#a)"/>

<rect x="375" y="170" width="250" height="92" rx="12" class="box"/>
<text class="h3" x="407" y="204">02 拆解制作流程</text>
<text class="b" x="407" y="232">材料获取 → 制作 → 固化</text>
<text class="s" x="407" y="252">确定游戏任务顺序</text>

<line x1="625" y1="216" x2="680" y2="216" class="line" marker-end="url(#a)"/>

<rect x="690" y="170" width="260" height="92" rx="12" class="gray"/>
<text class="h3" x="722" y="204">03 转译游戏机制</text>
<text class="b" x="722" y="232">知识点 → 操作 → 反馈</text>
<text class="s" x="722" y="252">将工艺转化为玩法</text>

<line x1="950" y1="216" x2="1005" y2="216" class="line" marker-end="url(#a)"/>

<rect x="1015" y="170" width="260" height="92" rx="12" class="box"/>
<text class="h3" x="1047" y="204">04 组织玩法模块</text>
<text class="b" x="1047" y="232">解谜 · 操作 · 采集 · 验证</text>
<text class="s" x="1047" y="252">形成多玩法系统</text>

<line x1="1275" y1="216" x2="1330" y2="216" class="line" marker-end="url(#a)"/>

<rect x="1340" y="170" width="380" height="92" rx="12" class="blk"/>
<text class="h3 whiteText" x="1372" y="204">05 串联完整游戏体验</text>
<text class="b whiteText" x="1372" y="232">探索 → 解谜 → 工序游戏 → 下一工序</text>
<text class="s whiteText" x="1372" y="252">最终完成漆器制作</text>
</g>

<!-- conversion core -->
<rect x="55" y="315" width="1690" height="45" rx="6" class="blk"/>
<text class="h2 whiteText" x="650" y="346">MECHANIC TRANSLATION · 工艺知识 → 游戏交互</text>

<!-- left knowledge -->
<rect x="70" y="405" width="330" height="500" rx="14" class="box"/>
<text class="h2" x="102" y="445">漆艺知识层</text>
<text class="s" x="102" y="470">WHAT TO LEARN</text>
<g>
<rect x="105" y="510" width="260" height="62" rx="8" class="gray"/><text class="h3" x="135" y="548">工序顺序</text>
<rect x="105" y="595" width="260" height="62" rx="8" class="gray"/><text class="h3" x="135" y="633">材料获取 / 采漆</text>
<rect x="105" y="680" width="260" height="62" rx="8" class="gray"/><text class="h3" x="135" y="718">漆色配方 / 比例</text>
<rect x="105" y="765" width="260" height="62" rx="8" class="gray"/><text class="h3" x="135" y="803">漆器结构 / 工艺</text>
<rect x="105" y="850" width="260" height="32" rx="8" class="gray"/><text class="b" x="135" y="872">阴干：湿度 / 温度 / 光照</text>
</g>

<!-- arrows -->
<path d="M400 540 C460 540 470 540 520 540" class="line" marker-end="url(#a)"/>
<path d="M400 626 C460 626 470 626 520 626" class="line" marker-end="url(#a)"/>
<path d="M400 711 C460 711 470 711 520 711" class="line" marker-end="url(#a)"/>
<path d="M400 796 C460 796 470 796 520 796" class="line" marker-end="url(#a)"/>
<path d="M400 866 C460 866 470 866 520 866" class="line" marker-end="url(#a)"/>

<!-- middle mechanic -->
<rect x="520" y="405" width="680" height="500" rx="14" class="gray"/>
<text class="h2" x="552" y="445">游戏机制转译层</text>
<text class="s" x="552" y="470">HOW TO PLAY</text>

<rect x="555" y="505" width="285" height="75" rx="9" class="box"/>
<text class="h3" x="585" y="535">书籍顺序解谜</text><text class="s" x="585" y="560">找线索 → 排列正确工序</text>
<rect x="880" y="505" width="285" height="75" rx="9" class="box"/>
<text class="h3" x="910" y="535">工艺解压操作</text><text class="s" x="910" y="560">点击 / 连续动作 + 声音反馈</text>

<rect x="555" y="610" width="285" height="75" rx="9" class="box"/>
<text class="h3" x="585" y="640">射击式材料采集</text><text class="s" x="585" y="665">进入场景 → 命中 → 获得材料</text>
<rect x="880" y="610" width="285" height="75" rx="9" class="box"/>
<text class="h3" x="910" y="640">采漆谜题</text><text class="s" x="910" y="665">时间 × 角度 × 位置 → 反应</text>

<rect x="555" y="715" width="285" height="75" rx="9" class="box"/>
<text class="h3" x="585" y="745">配方谜题</text><text class="s" x="585" y="770">比例推理 → 调漆 → 试片</text>
<rect x="880" y="715" width="285" height="75" rx="9" class="box"/>
<text class="h3" x="910" y="745">工艺修复谜题</text><text class="s" x="910" y="770">观察结构 → 推理 → 修复</text>

<rect x="715" y="820" width="285" height="58" rx="9" class="blk"/>
<text class="h3 whiteText" x="760" y="855">环境谜题：调节阴干条件</text>

<!-- right experience -->
<path d="M1200 650 C1250 650 1260 650 1310 650" class="line" marker-end="url(#a)"/>
<rect x="1310" y="405" width="410" height="500" rx="14" class="box"/>
<text class="h2" x="1342" y="445">玩家体验层</text>
<text class="s" x="1342" y="470">PLAYER JOURNEY</text>

<circle cx="1515" cy="540" r="55" class="box"/>
<text class="h3" x="1480" y="535">探索</text><text class="s" x="1481" y="558">发现线索</text>
<line x1="1515" y1="595" x2="1515" y2="640" class="line" marker-end="url(#a)"/>
<circle cx="1515" cy="695" r="55" class="gray"/>
<text class="h3" x="1480" y="690">操作</text><text class="s" x="1470" y="713">完成工序玩法</text>
<line x1="1515" y1="750" x2="1515" y2="795" class="line" marker-end="url(#a)"/>
<circle cx="1515" cy="850" r="55" class="blk"/>
<text class="h3 whiteText" x="1480" y="845">推进</text><text class="s whiteText" x="1468" y="868">解锁下一工序</text>

<!-- bottom -->
<path d="M1515 905 C1515 970 1250 985 950 985 C650 985 400 970 400 930" class="dash" marker-end="url(#a)"/>
<text class="s" x="790" y="1012">循环：完成当前工序 → 获得新线索 → 进入下一阶段</text>
</svg>