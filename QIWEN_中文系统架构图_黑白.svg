<text class="w h2" x="2137" y="826">试玩、反思与修改</text>
<text class="w small" x="2137" y="853">试玩 → 反馈 → 修改</text>
<text class="w small" x="2137" y="876">重新编译 → 再试玩</text>
<text class="w small" x="2137" y="899">玩家最终确认完成</text>
</g>

