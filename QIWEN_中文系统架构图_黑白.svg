<text class="t h2" x="597" y="826">形成玩法方案</text>
<text class="m small" x="597" y="853">核心机制 / 循环 / 世界观</text>
<text class="m small" x="597" y="876">胜负条件 / 学习目标</text>
<text class="m small" x="597" y="899">机制—知识一致性检查</text>
</g>

<g>
<rect class="panel" x="845" y="770" width="230" height="145" rx="10"/>
