<text class="m small" x="1377" y="853">情绪 / 节奏 / 时长</text>
<text class="m small" x="1377" y="876">试听 / 对比 / 保存</text>
<text class="m small" x="1377" y="899">玩家确认 BGM</text>
</g>

<g>
<rect class="panel" x="1610" y="770" width="235" height="145" rx="10"/>
<text class="t micro" x="1632" y="796">07 游戏逻辑</text>
<text class="t h2" x="1632" y="826">逻辑规格确认</text>
<text class="m small" x="1632" y="853">输入 / 规则 / 交互 / 反馈</text>
<text class="m small" x="1632" y="876">先解释，再生成代码</text>
<text class="m small" x="1632" y="899">玩家批准后才编程</text>
</g>

<g>
<rect class="panel" x="1870" y="770" width="220" height="145" rx="10"/>
