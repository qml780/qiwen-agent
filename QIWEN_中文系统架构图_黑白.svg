<text class="m small" x="1122" y="853">文本 / 图片生成 3D</text>
<text class="m small" x="1122" y="876">旋转 / 查看 / 多版本</text>
<text class="m small" x="1122" y="899">玩家确认模型</text>
</g>

<g>
<rect class="panel" x="1355" y="770" width="230" height="145" rx="10"/>
