<rect class="bg" width="2400" height="1500"/>

<!-- 标题 -->
<text class="t title" x="70" y="66">《漆问》｜反思式 Agent 辅助非遗游戏共创系统架构</text>
<text class="m body" x="72" y="98">从权威漆艺知识、用户独立构思、人机共创，到多模态资产生成、Unity 构建与试玩反思的完整系统</text>
<line x1="70" y1="120" x2="2330" y2="120" class="line"/>

<rect class="black" x="70" y="150" width="2260" height="82" rx="10"/>
<text class="w micro" x="96" y="179">核心系统逻辑</text>
<text class="w h1" x="96" y="211">权威知识 → 用户独立构思 → Agent 反思与批评 → 玩家确认 → 资产生成 → Unity 实现 → 试玩与修改</text>
<text class="w body" x="1940" y="203">AI 建议 · 人类决定</text>

<!-- 01 知识基础 -->
<text class="t h1" x="70" y="286">01  知识基础层</text>
<text class="m small" x="260" y="286">知识提前采集、整理和核验，而非玩家使用时实时生成</text>

<!-- 来源 -->
<rect class="panel" x="70" y="315" width="545" height="350" rx="12"/>
<text class="t micro" x="95" y="342">A / 知识来源</text>
<text class="t h1" x="95" y="376">漆艺知识采集</text>

<rect class="soft" x="95" y="404" width="145" height="65" rx="8"/>
<text class="t h2" x="119" y="430">公开资料</text>
<text class="m small" x="113" y="452">论文 / 书籍 / 馆藏</text>

<rect class="soft" x="257" y="404" width="145" height="65" rx="8"/>
<text class="t h2" x="289" y="430">官方资料</text>
<text class="m small" x="278" y="452">非遗 / 博物馆 / 行业</text>

<rect class="soft" x="419" y="404" width="170" height="65" rx="8"/>
<text class="t h2" x="455" y="430">专家访谈</text>
<text class="m small" x="438" y="452">传承人 / 制作人 / 专家</text>

<line x1="168" y1="469" x2="168" y2="512" class="thin"/>
<line x1="330" y1="469" x2="330" y2="512" class="thin"/>
<line x1="504" y1="469" x2="504" y2="512" class="thin"/>
