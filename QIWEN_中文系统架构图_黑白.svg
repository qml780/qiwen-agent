<text class="t h2" x="337" y="826">Agent 追问与批评</text>
<text class="m small" x="337" y="853">理解 → 追问 → 指出问题</text>
<text class="m small" x="337" y="876">接受 / 拒绝 / 修改</text>
<text class="m small" x="337" y="899">多轮共创</text>
</g>

<g>
<rect class="panel" x="575" y="770" width="245" height="145" rx="10"/>
