<text class="t h2" x="1892" y="826">可见式游戏实现</text>
<text class="m small" x="1892" y="853">Agent 搭建基础骨架</text>
<text class="m small" x="1892" y="876">玩家参与素材组装</text>
<text class="m small" x="1892" y="899">Unity 编辑器前台可见</text>
</g>

<g>
