<rect class="dark" x="178" y="540" width="316" height="64" rx="8"/>
<text class="w h2" x="259" y="566">研究者整理与核验</text>
<text class="w small" x="227" y="588">信息清洗 · 来源标注 · 专家审核 · 知识拆分</text>

<line x1="336" y1="604" x2="336" y2="629" class="line" marker-end="url(#a)"/>
<text class="m small" x="224" y="650">输出：可追溯、可复用的预制知识条目</text>

<!-- 知识库结构 -->
<rect class="panel" x="645" y="315" width="690" height="350" rx="12"/>
<text class="t micro" x="670" y="342">B / 预制知识库</text>
<text class="t h1" x="670" y="376">《漆问》知识库</text>

<rect class="soft" x="670" y="403" width="185" height="94" rx="8"/>
<text class="t h2" x="708" y="429">文化知识层</text>
<text class="m small" x="690" y="453">材料 / 工艺 / 技法</text>
<text class="m small" x="690" y="474">器物 / 历史 / 地域</text>

<rect class="soft" x="875" y="403" width="205" height="94" rx="8"/>
<text class="t h2" x="913" y="429">专家经验层</text>
<text class="m small" x="895" y="453">常见错误 / 判断经验</text>
<text class="m small" x="895" y="474">视觉 / 声音 / 触觉线索</text>

<rect class="soft" x="1100" y="403" width="210" height="94" rx="8"/>
<text class="t h2" x="1130" y="429">游戏可供性层</text>
<text class="m small" x="1120" y="453">动作 / 变量 / 失败条件</text>
<text class="m small" x="1120" y="474">机制方向 / 学习目标</text>

<line x1="762" y1="497" x2="762" y2="535" class="thin"/>
<line x1="978" y1="497" x2="978" y2="535" class="thin"/>
<line x1="1205" y1="497" x2="1205" y2="535" class="thin"/>
<line x1="762" y1="535" x2="1205" y2="535" class="thin"/>

<rect class="black" x="768" y="553" width="448" height="71" rx="8"/>
<text class="w h2" x="920" y="579">知识条目</text>
<text class="w small" x="800" y="602">知识简介 · 工艺步骤 · 关键动作 · 常见误区 · 来源 · 游戏可供性</text>

<!-- 玩家进入 -->
<rect class="panel" x="1365" y="315" width="965" height="350" rx="12"/>
<text class="t micro" x="1390" y="342">C / 玩家进入方式</text>
<text class="t h1" x="1390" y="376">从知识浏览进入共创项目</text>

<rect class="soft" x="1390" y="405" width="185" height="74" rx="8"/>
<text class="t h2" x="1438" y="434">浏览知识</text>
<text class="m small" x="1432" y="458">知识库 / 知识卡片</text>

