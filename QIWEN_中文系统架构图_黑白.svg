<rect class="soft" x="1635" y="405" width="190" height="74" rx="8"/>
<text class="t h2" x="1678" y="434">选择知识点</text>
<text class="m small" x="1672" y="458">固定知识上下文</text>

<line x1="1825" y1="442" x2="1870" y2="442" class="line" marker-end="url(#a)"/>

<rect class="dark" x="1885" y="405" width="200" height="74" rx="8"/>
<text class="w h2" x="1934" y="434">创建项目</text>
<text class="w small" x="1916" y="458">建立独立创作空间</text>

<line x1="2085" y1="442" x2="2125" y2="442" class="line" marker-end="url(#a)"/>

<rect class="soft" x="2140" y="405" width="165" height="74" rx="8"/>
<text class="t h2" x="2178" y="434">玩家先构思</text>
<text class="m small" x="2172" y="458">保存原始想法</text>

<rect class="dash" x="1390" y="522" width="915" height="104" rx="9"/>
<text class="t h2" x="1413" y="549">关键研究设计：保留玩家最初构想</text>
<text class="m body" x="1413" y="575">系统持续记录：原始想法 → Agent 提问与建议 → 玩家拒绝 / 接受 / 修改 → 最终游戏。</text>
<text class="m small" x="1413" y="600">用于分析创意归属、作者感、Agent 影响、知识理解变化与人机共创过程。</text>

<!-- 02 共创流程 -->
<text class="t h1" x="70" y="720">02  人机共创流程</text>
<text class="m small" x="295" y="720">Agent 不直接替用户设计；每个关键阶段都设置玩家确认节点</text>
<line x1="105" y1="846" x2="2290" y2="846" class="line" stroke-width="2.2" marker-end="url(#a)"/>

<g>
<rect class="panel" x="70" y="770" width="220" height="145" rx="10"/>
<text class="t micro" x="92" y="796">01 独立构思</text>
<text class="t h2" x="92" y="826">玩家提出游戏想法</text>
<text class="m small" x="92" y="853">玩法 / 世界观 / 核心体验</text>
<text class="m small" x="92" y="876">Agent 此时不抢先设计</text>
<rect class="g2" x="92" y="888" width="176" height="20" rx="4"/>
